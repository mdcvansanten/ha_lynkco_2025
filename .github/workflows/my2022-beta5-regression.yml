name: MY2022 beta5 offline regression

on:
  push:
    branches:
      - lynkco-my2022-v0.6.3-beta5-session
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Syntax check
        run: python3 -m compileall -q custom_components/lynkco
      - name: Offline mocked API regression
        run: python3 -m unittest discover -s tests -p test_beta5_session.py -v
